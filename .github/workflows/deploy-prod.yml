name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-api-migrations:
    name: Deploy API Migrations (Drizzle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Verify DB connection mode
        run: |
          # Transaction pooler (port 6543) doesn't support DDL - reject it
          if echo "$DATABASE_URL" | grep -q ":6543"; then
            echo "❌ DATABASE_URL uses transaction pooler (port 6543). Migrations require session mode (port 5432)."
            exit 1
          fi
          # Log connection mode for debugging (without exposing secrets)
          if echo "$DATABASE_URL" | grep -q "pooler.supabase.com"; then
            echo "✅ Using Supavisor session pooler (port 5432) - OK for migrations"
            echo "   Note: Session pooler is acceptable for DDL given GitHub Actions IPv6 limitations"
          else
            echo "✅ Using direct database connection (port 5432)"
          fi

      - name: Guard against Supabase migrations
        run: |
          if find apps/ota/supabase/migrations -maxdepth 1 -name "*.sql" -not -path "*/_archive/*" 2>/dev/null | grep -q .; then
            echo "❌ Found .sql files in apps/ota/supabase/migrations/"
            echo "All migrations must be in packages/database/src/migrations/ (Drizzle)"
            exit 1
          fi
          echo "✅ No Supabase migrations found (Drizzle-only)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @tailfire/database build

      - name: Validate migration journal monotonicity
        run: pnpm --filter @tailfire/database migrations:validate-journal

      - name: Pre-migration enum additions
        run: |
          psql "$DATABASE_URL" -c "ALTER TYPE trip_status ADD VALUE IF NOT EXISTS 'planning'" || true
          psql "$DATABASE_URL" -c "ALTER TYPE trip_status ADD VALUE IF NOT EXISTS 'active'" || true
          psql "$DATABASE_URL" -c "ALTER TYPE trip_status ADD VALUE IF NOT EXISTS 'travelling'" || true
          psql "$DATABASE_URL" -c "ALTER TYPE trip_status ADD VALUE IF NOT EXISTS 'travelled'" || true
          psql "$DATABASE_URL" <<'ENUMSQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'activity_proposal_status') THEN
              CREATE TYPE activity_proposal_status AS ENUM ('draft', 'proposing', 'approved', 'cancelled');
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'activity_booking_status') THEN
              CREATE TYPE activity_booking_status AS ENUM ('unbooked', 'booked', 'cancelled');
            END IF;
          END $$;
          ENUMSQL
          echo "✅ Pre-migration enum setup complete"

      - name: Run Drizzle migrations
        working-directory: apps/api
        run: pnpm db:migrate

  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    needs: [deploy-api-migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          # Project tokens are scoped to environment, no link needed
          railway up --service api-prod --detach

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for Railway deployment to start..."
          sleep 30
          for i in {1..20}; do
            if curl -sf https://api.tailfire.ca/api/v1/health; then
              echo "✅ API deployment ready"
              exit 0
            fi
            echo "Attempt $i/20 - waiting 15s..."
            sleep 15
          done
          echo "❌ API deployment not ready after 5 minutes"
          exit 1

  deploy-admin:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-api-migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Fix project settings
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_ADMIN_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/admin","installCommand":"pnpm install","buildCommand":"pnpm --filter @tailfire/database build && pnpm --filter @tailfire/shared-types build && pnpm --filter @tailfire/admin build"}'

      - name: Deploy Admin (Production)
        run: VERCEL_ORG_ID=$VERCEL_ORG_ID VERCEL_PROJECT_ID=$VERCEL_ADMIN_PROJECT_ID vercel deploy --prod --token=$VERCEL_TOKEN --yes

  deploy-ota:
    name: Deploy OTA to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-api-migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Fix project settings
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_OTA_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/ota","installCommand":"pnpm install","buildCommand":"pnpm --filter @tailfire/ota build"}'

      - name: Deploy OTA (Production)
        run: VERCEL_ORG_ID=$VERCEL_ORG_ID VERCEL_PROJECT_ID=$VERCEL_OTA_PROJECT_ID vercel deploy --prod --token=$VERCEL_TOKEN --yes

  deploy-client:
    name: Deploy Client to Vercel
    runs-on: ubuntu-latest
    needs: [deploy-api-migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          inject-env-vars: true

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Fix project settings
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_CLIENT_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/client","installCommand":"pnpm install","buildCommand":"pnpm --filter @tailfire/database build && pnpm --filter @tailfire/shared-types build && pnpm --filter @tailfire/client build"}'

      - name: Deploy Client (Production)
        run: VERCEL_ORG_ID=$VERCEL_ORG_ID VERCEL_PROJECT_ID=$VERCEL_CLIENT_PROJECT_ID vercel deploy --prod --token=$VERCEL_TOKEN --yes

  smoke-test:
    name: Smoke Test All Services
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-admin, deploy-ota, deploy-client]
    steps:
      # B10: smoke coverage expanded from a single API health check to a
      # multi-surface readiness sweep. Every check below blocks the workflow
      # on failure. When smoke fails, see docs/runbooks/post-deploy-rollback.md
      # for the manual revert procedure (auto-revert is a follow-up scope item).
      #
      # Each check uses --max-time 30 + --retry 3 to absorb cold-start flakes.
      # Auth-gated flows (magic-link callback, /portal/my-profile, OTA
      # service-key proxy POST, Stripe webhook) need CI secrets and run as
      # part of UAT (B5/B10 follow-up), not in this workflow.

      - name: Wait for cold-start propagation
        run: sleep 20

      - name: API health (api.tailfire.ca)
        run: |
          curl -sf --max-time 30 --retry 3 --retry-delay 5 \
            https://api.tailfire.ca/api/v1/health \
            && echo "✅ API health check passed" \
            || { echo "❌ API health check failed"; exit 1; }

      - name: API rejects unknown CORS origin (regression guard)
        run: |
          # Should NOT include allow-origin for an unknown origin
          response=$(curl -sf --max-time 30 --retry 3 --retry-delay 5 \
            -X OPTIONS -H "Origin: https://attacker.example.com" \
            -H "Access-Control-Request-Method: POST" \
            -i https://api.tailfire.ca/api/v1/health 2>&1 || true)
          if echo "$response" | grep -qi "access-control-allow-origin: https://attacker.example.com"; then
            echo "❌ CORS regression: unknown origin was permitted"
            exit 1
          fi
          echo "✅ CORS rejects unknown origin"

      - name: OTA homepage loads (ota.phoenixvoyages.ca)
        run: |
          status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            https://ota.phoenixvoyages.ca/)
          if [ "$status" != "200" ]; then
            echo "❌ OTA homepage returned HTTP $status (expected 200)"
            exit 1
          fi
          echo "✅ OTA homepage 200"

      - name: OTA destinations index renders (server-render check)
        run: |
          # Public marketing page; should be SSR'd or static
          status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            https://ota.phoenixvoyages.ca/destinations)
          if [ "$status" != "200" ]; then
            echo "⚠️  OTA /destinations returned HTTP $status (non-blocking — page may not exist)"
          else
            echo "✅ OTA /destinations 200"
          fi

      - name: Admin login page loads (tailfire.phoenixvoyages.ca)
        run: |
          # Unauthenticated request should return 200 with login UI or 302 to login
          status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            https://tailfire.phoenixvoyages.ca/login)
          if [ "$status" != "200" ] && [ "$status" != "307" ]; then
            echo "❌ Admin /login returned HTTP $status (expected 200 or 307)"
            exit 1
          fi
          echo "✅ Admin /login responds"

      - name: Client portal login page loads (client.phoenixvoyages.ca)
        run: |
          status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            https://client.phoenixvoyages.ca/)
          if [ "$status" != "200" ] && [ "$status" != "307" ]; then
            echo "❌ Client root returned HTTP $status (expected 200 or 307)"
            exit 1
          fi
          echo "✅ Client root responds"

      - name: API rejects bad JWT (auth path active)
        run: |
          # Sanity check that JwtAuthGuard is hot — bad token must 401
          status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
            -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer not-a-real-token" \
            https://api.tailfire.ca/api/v1/users/me)
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "❌ Bad-JWT returned HTTP $status (expected 401/403; auth may be broken)"
            exit 1
          fi
          echo "✅ JwtAuthGuard rejects bad tokens"

      - name: Summary
        run: |
          echo "🚀 All production deployments + smoke checks passed!"
          echo ""
          echo "Endpoints:"
          echo "  API:    https://api.tailfire.ca"
          echo "  Admin:  https://tailfire.phoenixvoyages.ca"
          echo "  OTA:    https://ota.phoenixvoyages.ca"
          echo "  Client: https://client.phoenixvoyages.ca"
          echo ""
          echo "Manual UAT items not exercised in CI smoke (need test agent + consumer creds):"
          echo "  - Magic-link request → callback → session"
          echo "  - /portal/my-profile after auth"
          echo "  - OTA service-key proxy POST (/api/consumer-activity)"
          echo "  - Email send via Resend"
          echo "  - R2 signed-URL fetch"
          echo "  - Stripe webhook accept"
          echo "See docs/runbooks/post-deploy-uat.md for the manual checklist."
